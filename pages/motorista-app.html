<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motorista - Executiva Agronegocios</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body id="motorista-app-page" class="driver-body">
  <main class="driver-app">
    <header class="driver-header">
      <div>
        <span class="driver-kicker">Executiva</span>
        <h1>Conferencia de pneus</h1>
      </div>
      <button class="driver-logout" type="button" onclick="fazerLogout()">Sair</button>
    </header>

    <section class="driver-user-card">
      <span>Motorista</span>
      <strong id="driverUserName">-</strong>
    </section>

    <section class="driver-card">
      <div class="driver-card-title">
        <h2>Enviar conferencia</h2>
        <p>Informe o KM e marque se houve alteracao nos pneus do veiculo.</p>
      </div>

      <div class="driver-form">
        <div class="form-group">
          <label>Data *</label>
          <input type="date" id="dataMov" class="form-control">
        </div>

        <div class="form-group">
          <label>Veiculo *</label>
          <select id="veiculoAtual" class="form-control select-veiculos"></select>
        </div>

        <div class="form-group">
          <label>KM do veiculo *</label>
          <input type="number" id="kmVeiculo" class="form-control" inputmode="numeric" placeholder="KM atual">
        </div>

        <div class="form-group">
          <label>Situacao *</label>
          <select id="tipoMov" class="form-control" onchange="toggleDriverMovFields()">
            <option value="SemAlteracao">Sem alteracao</option>
            <option value="Troca">Troca de pneu</option>
            <option value="Instalacao">Instalacao</option>
            <option value="Retirada">Retirada</option>
            <option value="Atualizacao">Atualizacao</option>
            <option value="Baixa">Baixa / Sucata</option>
          </select>
        </div>

        <input type="hidden" id="veiculoAnterior" value="Estoque">
        <input type="hidden" id="localAnterior" value="Estoque">

        <input type="hidden" id="tipoVeiculo" value="Cavalo">

        <div class="form-group driver-item-field driver-single-pneu">
          <label>Nº Fogo do Pneu *</label>
          <input type="text" id="numeroPneu" class="form-control" inputmode="numeric" placeholder="Ex: 123456">
        </div>

        <div class="driver-position-grid driver-item-field driver-troca-field">
          <div class="form-group">
            <label>Pneu que saiu</label>
            <input type="text" id="pneuSaiu" class="form-control" inputmode="numeric" placeholder="Fogo retirado">
          </div>
          <div class="form-group">
            <label>Pneu que entrou</label>
            <input type="text" id="pneuEntrou" class="form-control" inputmode="numeric" placeholder="Fogo colocado">
          </div>
        </div>

        <div class="driver-position-grid driver-item-field driver-posicao-field">
          <div class="form-group">
            <label>Eixo</label>
            <select id="eixo" class="form-control" onchange="toggleStepField()">
              <option value="">Selecione</option>
              <option value="1º EIXO">1º EIXO</option>
              <option value="2º EIXO">2º EIXO</option>
              <option value="3º EIXO">3º EIXO</option>
              <option value="4º EIXO">4º EIXO</option>
              <option value="5º EIXO">5º EIXO</option>
              <option value="STEP">STEP</option>
            </select>
          </div>

          <div class="form-group">
            <label>Lado</label>
            <select id="lado" class="form-control" onchange="atualizarLocal()">
              <option value="">Selecione</option>
              <option value="LD">LD</option>
              <option value="LE">LE</option>
              <option value="LDD">LDD</option>
              <option value="LDF">LDF</option>
              <option value="LED">LED</option>
              <option value="LEF">LEF</option>
            </select>
          </div>
        </div>

        <div class="form-group" id="stepNumeroGroup" style="display:none;">
          <label>Qual Step</label>
          <select id="stepNumero" class="form-control" onchange="atualizarLocal()">
            <option value="">Selecione</option>
            <option value="1º Step">1º Step</option>
            <option value="2º Step">2º Step</option>
          </select>
        </div>

        <div class="form-group driver-item-field driver-posicao-field">
          <label>Posicao</label>
          <input type="text" id="localAtual" class="form-control" readonly>
        </div>

        <div class="form-group">
          <label>Observacao</label>
          <textarea id="observacao" class="form-control" rows="3" placeholder="Ex: troca feita em borracharia"></textarea>
        </div>

        <button id="btnAdicionarConferenciaItem" class="driver-secondary" type="button">Adicionar alteracao</button>
        <div id="conferenciaItensList" class="driver-conference-list"></div>

        <button id="btnSalvarMov" class="driver-submit" type="button">Enviar conferencia</button>
      </div>
    </section>

    <section class="driver-card driver-history">
      <div class="driver-card-title">
        <h2>Ultimas conferencias</h2>
      </div>
      <div id="driverHistoryList" class="driver-history-list"></div>
    </section>
  </main>

  <script>
    function toggleDriverMovFields() {
      const tipo = document.getElementById('tipoMov').value;
      const semAlteracao = tipo === 'SemAlteracao';
      const troca = tipo === 'Troca';
      document.querySelectorAll('.driver-item-field').forEach(el => el.style.display = semAlteracao ? 'none' : '');
      document.querySelectorAll('.driver-troca-field').forEach(el => el.style.display = troca ? '' : 'none');
      document.querySelectorAll('.driver-single-pneu').forEach(el => el.style.display = (!semAlteracao && !troca) ? '' : 'none');
      document.getElementById('btnAdicionarConferenciaItem').style.display = semAlteracao ? 'none' : '';
      if (semAlteracao) document.getElementById('localAtual').value = '';
    }
  </script>
  <script src="../assets/js/app.js"></script>
</body>

</html>
